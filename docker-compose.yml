version: '3.8'

services:
  storage:
    image: minio/minio
    command: server /data --console-address :9090
    ports:
      - 9090:9090
      - 9000:9000
    volumes:
      - s3data:/data

  db:
    image: postgres:15-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=kcwRzG4coiE

  keycloak:
    image: quay.io/keycloak/keycloak
    command: --verbose start-dev --import-realm --features=account3,declarative-user-profile
    ports:
      - 8080:8080
    volumes:
      - ./realm:/opt/keycloak/data/import
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_FEATURES=account3,declarative-user-profile
      - KC_HEALTH_ENABLED=true
      - KC_HOSTNAME=${CODESPACE_NAME}-8080.app.github.dev  # uncomment if running in vscodespaces
      - KC_PROXY=edge

  backend:
    build: backend
    command:  [ "uvicorn", "bbe2.main:app", "--reload", "--reload-dir", "bbe2", "--host", "0.0.0.0" ]
    volumes:
      - ./backend:/project
    ports:
      - 8000:8000
    environment:
      - JWT_AUDIENCE=bbe2
      - JWT_ISSUER=https://${CODESPACE_NAME}-8080.app.github.dev/realms/bagadmenru
      - OIDC_AUTHORIZATION_URL=http://keycloak:8080/realms/bagadmenru/protocol/openid-connect/auth
      - OIDC_TOKEN_URL=http://keycloak:8080/realms/bagadmenru/protocol/openid-connect/token
      - OIDC_JWKS_URL=http://keycloak:8080/realms/bagadmenru/protocol/openid-connect/certs
      - CORS_ALLOWED_ORIGINS=["https://${CODESPACE_NAME}-5173.app.github.dev"]
      - S3_ENDPOINT=http://storage:9000
      - S3_BUCKET_NAME=bagadmenru5-dev
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET_NAME=mybucket
      - DATABASE_URL=postgresql+psycopg://postgres:kcwRzG4coiE@db/postgres

  frontend:
    build:
      context: frontend
      target: node-env
    volumes:
      - ./frontend:/project
    ports:
      - 5173:5173
      - 6006:6006
    environment:
      - VITE_BBE2_API_URL=https://${CODESPACE_NAME}-5173.app.github.dev
      - VITE_OIDC_PROVIDER_URL=https://${CODESPACE_NAME}-5173.app.github.dev/realms/bagadmenru

volumes:
  s3data:
  pgdata:
