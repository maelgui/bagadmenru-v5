services:
  storage:
    image: minio/minio
    command: server /data --console-address :9090
    ports:
      - 9090:9090
      - 9000:9000
    volumes:
      - s3data:/data

  db:
    image: postgres:15-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=kcwRzG4coiE

  mailhog:
    image: mailhog/mailhog
    ports:
      - 1025:1025
      - 8025:8025

  backend:
    build: backend
    command:  [ "uvicorn", "bbe2.main:app", "--reload", "--reload-dir", "bbe2", "--host", "0.0.0.0" ]
    volumes:
      - ./backend:/project
    ports:
      - 8888:8000
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:kcwRzG4coiE@db/postgres
      - DOMAIN=localhost
      - S3_ENDPOINT=http://storage:9000
      - S3_BUCKET_NAME=bagadmenru5-dev
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - OIDC_ISSUER=http://auth-provider:3000/
      - OIDC_AUDIENCE=http://localhost:5173
      - USER_API_ENDPOINT=http://auth-provider:3001/
      - EMAIL_API_ENDPOINT=http://email-api:9999/
      - TOKEN_SECRET_KEY=my-super-secret-key

  frontend:
    build:
      context: frontend
      target: node-env
    volumes:
      - ./frontend:/project
    ports:
      - 5173:5173
      - 6006:6006
    environment:
      - VITE_BBE2_API_URL=http://localhost:5173
      - VITE_OIDC_PROVIDER_URL=http://localhost:3000/
      - VITE_OIDC_CLIENT_ID=bagad-frontend-dev

  auth-provider:
    build: auth-provider
    command: yarn dev
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:kcwRzG4coiE@db/auth
      - RP_ID=localhost
      - ORIGIN=http://localhost:3000
    volumes:
      - ./auth-provider/src:/app/src
      - authdata:/data/

  email-api:
    build: email-api
    ports:
      - 9999:9999
    environment:
      - APP_email_from=contact@bagadmenru.bzh
      - APP_imap_domain=ssl0.ovh.net
      - APP_imap_port=993
      - APP_imap_username=contact@bagadmenru.bzh
      - APP_listen=0.0.0.0:9999
      - APP_oidc_issuer=http://auth-provider:3000
      - RUST_LOG=debug
      - APP_smtp_domain=mailhog
      - APP_smtp_port=1025
      - APP_smtp_tls=false

volumes:
  s3data:
  pgdata:
  orydata:
  authdata:
