services:
  storage:
    image: minio/minio
    command: server /data --console-address :9090
    ports:
      - 9090:9090
      - 9000:9000
    volumes:
      - s3data:/data

  db:
    image: postgres:15-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=kcwRzG4coiE

  mailhog:
    image: mailhog/mailhog
    ports:
      - 1025:1025
      - 8025:8025

  backend:
    build: backend
    command:  [ "uvicorn", "bbe2.main:app", "--reload", "--reload-dir", "bbe2", "--host", "0.0.0.0" ]
    volumes:
      - ./backend:/project
    ports:
      - 8000:8000
    environment:
      - CORS_ALLOWED_ORIGINS=["http://localhost:5173"]
      - DATABASE_URL=postgresql+psycopg://postgres:kcwRzG4coiE@db/postgres
      - DOMAIN=localhost
      - S3_ENDPOINT=http://storage:9000
      - S3_BUCKET_NAME=bagadmenru5-dev
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - OIDC_ISSUER=http://auth-provider:3000/
      - USER_API_ENDPOINT=http://auth-provider:3001/

  frontend:
    build:
      context: frontend
      target: node-env
    volumes:
      - ./frontend:/project
    ports:
      - 5173:5173
      - 6006:6006
    environment:
      - VITE_BBE2_API_URL=http://localhost:5173
      - VITE_OIDC_PROVIDER_URL=http://localhost:3000/
      - VITE_OIDC_CLIENT_ID=bagad-frontend-dev

  auth-provider:
    build: auth-provider
    ports:
      - 3000:3000
    environment:
      - DATABASE_URL=postgresql://postgres:kcwRzG4coiE@db/auth
    volumes:
      - ./auth-provider/src:/app/src
      - ./auth-provider/prisma:/app/prisma
      - authdata:/data/

volumes:
  s3data:
  pgdata:
  orydata:
  authdata:
