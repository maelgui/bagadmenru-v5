services:
  storage:
    image: minio/minio
    command: server /data --console-address :9090
    # No published host ports: the MinIO console is reached through the vite
    # proxy (/minio) on the frontend origin. The API talks to it in-network.
    volumes:
      - s3data:/data

  db:
    image: postgres:15-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=kcwRzG4coiE

  mailpit:
    image: axllent/mailpit
    # No published host ports: the Mailpit web UI is reached through the vite
    # proxy (/mailpit) on the frontend origin; SMTP is in-network only.
    # MP_WEBROOT makes Mailpit serve under /mailpit and emit prefix-aware asset
    # and API URLs, so the proxy needs no path rewrite (its own /css, /js, /api
    # requests already carry the /mailpit prefix).
    environment:
      - MP_WEBROOT=mailpit

  backend-init:
    build: backend
    command: ["sh", "-c", "alembic upgrade head && bbe2 seed-e2e"]
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:kcwRzG4coiE@db/postgres
      - E2E_USER_PASSWORD=E2eTest1234!
      - E2E_ADMIN_PASSWORD=E2eAdmin1234!
    volumes:
      - ./backend:/project
    depends_on:
      - db

  backend:
    build: backend
    command:
      [
        "uvicorn",
        "bbe2.main:app",
        "--reload",
        "--reload-dir",
        "bbe2",
        "--host",
        "0.0.0.0",
      ]
    volumes:
      - ./backend:/project
    # No published host port: the backend is reached in-network via the vite
    # proxy (/api, /docs, /openapi.json) on the frontend origin.
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+psycopg://postgres:kcwRzG4coiE@db/postgres
      - FRONTEND_BASE_URL=http://localhost:${FRONTEND_PORT:-5173}
      - S3_ENDPOINT=http://storage:9000
      - S3_BUCKET_NAME=bagadmenru5-dev
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - JWT_SECRET_KEY=my-super-secret-key
      - TOKEN_SECRET_KEY=my-super-secret-key
      # Email (direct SMTP via mailpit, IMAP via OVH)
      - RELYING_PARTY_ID=localhost
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_USE_TLS=false
      - EMAIL_FROM=Bagad Men Ru <contact@bagadmenru.bzh>
      - EMAIL_DRY_RUN=false
      - IMAP_HOST=ssl0.ovh.net
      - IMAP_PORT=993
      - IMAP_USERNAME=contact@bagadmenru.bzh
      - IMAP_PASSWORD=${IMAP_PASSWORD}
      - SECRET_KEY=my-super-secret-key
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_PUBLIC_KEY=BEibjIo7p3zTBbEJc2Oywfvxe655TUTH-cklnkx0dPtAN2FktdtDEJV91xMrCdEbMaNBupoB699ENzTC3zr_ZWM
      - VAPID_CLAIMS_EMAIL=mailto:contact@bagadmenru.bzh
      - HELLOASSO_WEBHOOK_TOKEN=${HELLOASSO_WEBHOOK_TOKEN:-}
    depends_on:
      - backend-init
      - db

  frontend:
    build:
      context: frontend
      target: node-env
    volumes:
      - ./frontend:/project
      # Keep the container's own (linux) node_modules — the source bind-mount
      # above would otherwise shadow them with the host's (macOS) install,
      # which carries incompatible native binaries (e.g. rolldown/vite).
      - /project/node_modules
      - /project/app/node_modules
      - /project/lib/node_modules
    ports:
      - ${FRONTEND_PORT:-5173}:5173
      - ${STORYBOOK_PORT:-6006}:6006
    environment:
      # The app calls /api on its own origin; vite proxies it to the backend.
      - VITE_BBE2_API_URL=http://localhost:${FRONTEND_PORT:-5173}
      # Vite listens on this port inside the container (published via
      # FRONTEND_PORT). Proxy targets are fixed to the compose service names in
      # vite.config.ts.
      - VITE_PORT=5173

volumes:
  s3data:
  pgdata:
