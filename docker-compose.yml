services:
  storage:
    image: minio/minio
    command: server /data --console-address :9090
    ports:
      - 9090:9090
      - 9000:9000
    volumes:
      - s3data:/data

  db:
    image: postgres:15-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=kcwRzG4coiE

  mailpit:
    image: axllent/mailpit
    ports:
      - 1025:1025
      - 8025:8025
    environment:
      - MP_SMTP_RELAY_HOST=ssl0.ovh.net
      - MP_SMTP_RELAY_PORT=587
      - MP_SMTP_RELAY_STARTTLS=true
      - MP_SMTP_RELAY_AUTH=plain # optional - default none
      - MP_SMTP_RELAY_USERNAME=contact@bagadmenru.bzh # required for plain, login and cram-md5 auth
      - MP_SMTP_RELAY_PASSWORD=${EMAIL_PASSWORD}

  backend-migrate:
    build: backend
    command: ["alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:kcwRzG4coiE@db/postgres
    volumes:
      - ./backend:/project

  backend:
    build: backend
    command:
      [
        "uvicorn",
        "bbe2.main:app",
        "--reload",
        "--reload-dir",
        "bbe2",
        "--host",
        "0.0.0.0",
      ]
    volumes:
      - ./backend:/project
    ports:
      - 8888:8000
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:kcwRzG4coiE@db/postgres
      - DOMAIN=localhost
      - S3_ENDPOINT=http://storage:9000
      - S3_BUCKET_NAME=bagadmenru5-dev
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - JWT_SECRET_KEY=my-super-secret-key
      - EMAIL_API_ENDPOINT=http://email-api:9999/
      - AUTHORIZER_API_ENDPOINT=http://authorizer:8181/
      - TOKEN_SECRET_KEY=my-super-secret-key
    depends_on:
      backend-migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: frontend
      target: node-env
    volumes:
      - ./frontend:/project
    ports:
      - 5173:5173
      - 6006:6006
    environment:
      - VITE_BBE2_API_URL=http://localhost:5173
      - VITE_OIDC_PROVIDER_URL=http://localhost:3000
      - VITE_OIDC_CLIENT_ID=bagad-frontend-dev

  email-api:
    build: email-api
    ports:
      - 9999:9999
    environment:
      - RUST_LOG=debug
      - APP_listen=0.0.0.0:9999

      - APP_email_from=contact@bagadmenru.bzh

      - APP_imap_domain=ssl0.ovh.net
      - APP_imap_port=993
      - APP_imap_username=contact@bagadmenru.bzh

      - APP_smtp_domain=mailpit
      - APP_smtp_port=1025
      - APP_smtp_tls=false

      - APP_imap_password=${EMAIL_PASSWORD}

  authorizer:
    image: openpolicyagent/opa
    command: ["run", "-s", "/policies", "-w", "-c", "/policies/config.yaml"]
    ports:
      - 8181:8181
    volumes:
      - ./opa:/policies

volumes:
  s3data:
  pgdata:
  orydata:
  authdata:
