version: '3.8'

services:
  storage:
    image: minio/minio
    command: server /data --console-address :9090
    ports:
      - 9090:9090
    volumes:
      - s3data:/data

  db:
    image: postgres:alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=kcwRzG4coiE

  keycloak:
    image: quay.io/keycloak/keycloak
    command: --verbose start-dev --import-realm --features=account3,declarative-user-profile
    ports:
      - 8080:8080
    volumes:
      - ./realm:/opt/keycloak/data/import
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_FEATURES=account3,declarative-user-profile
      - KC_HEALTH_ENABLED=true

  backend:
    build: backend
    volumes:
      - ./backend:/project
    ports:
      - 8000:8000
    environment:
      - JWT_AUDIENCE=bbe2
      - JWT_ISSUER=http://keycloak:8080/realms/bagadmenru
      - OIDC_AUTHORIZATION_URL=http://keycloak:8080/realms/bagadmenru/protocol/openid-connect/auth
      - OIDC_TOKEN_URL=http://keycloak:8080/realms/bagadmenru/protocol/openid-connect/token
      - OIDC_JWKS_URL=http://keycloak:8080/realms/bagadmenru/protocol/openid-connect/certs
      - CORS_ALLOWED_ORIGINS=["http://localhost:5173"]
      - S3_ENDPOINT=http://storage:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin

  frontend:
    build:
      context: frontend
      target: node-env
    volumes:
      - ./frontend:/project
    ports:
      - 5173:5173
    environment:
      - VITE_BBE2_API_URL=http://localhost:8000
      - VITE_OIDC_PROVIDER_URL=http://keycloak:8080/realms/bagadmenru

volumes:
  s3data:
  pgdata:
