services:
  storage:
    image: minio/minio
    command: server /data --console-address :9090
    ports:
      - 9090:9090
      # - 9000:9000
    volumes:
      - s3data:/data

  db:
    image: postgres:15-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=kcwRzG4coiE

  mailpit:
    image: axllent/mailpit
    ports:
      - 1025:1025
      - 8025:8025

  backend-init:
    build: backend
    command: ["sh", "-c", "alembic upgrade head && bbe2 seed-e2e"]
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:kcwRzG4coiE@db/postgres
    volumes:
      - ./backend:/project
    depends_on:
      - db

  backend:
    build: backend
    command:
      [
        "uvicorn",
        "bbe2.main:app",
        "--reload",
        "--reload-dir",
        "bbe2",
        "--host",
        "0.0.0.0",
      ]
    volumes:
      - ./backend:/project
    ports:
      - 8888:8000
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:kcwRzG4coiE@db/postgres
      - FRONTEND_BASE_URL=http://localhost:5173
      - S3_ENDPOINT=http://storage:9000
      - S3_BUCKET_NAME=bagadmenru5-dev
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - JWT_SECRET_KEY=my-super-secret-key
      - TOKEN_SECRET_KEY=my-super-secret-key
      # Email (direct SMTP via mailpit, IMAP via OVH)
      - RELYING_PARTY_ID=localhost
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_USE_TLS=false
      - EMAIL_FROM=Bagad Men Ru <contact@bagadmenru.bzh>
      - EMAIL_DRY_RUN=false
      - IMAP_HOST=ssl0.ovh.net
      - IMAP_PORT=993
      - IMAP_USERNAME=contact@bagadmenru.bzh
      - IMAP_PASSWORD=gJBSySEy7Vo
      - SECRET_KEY=my-super-secret-key
      - VAPID_PRIVATE_KEY=-YgwVxjbQ_DVQgqk6Hl-z0WJUz04FJsqJiep26scF90
      - VAPID_PUBLIC_KEY=BEibjIo7p3zTBbEJc2Oywfvxe655TUTH-cklnkx0dPtAN2FktdtDEJV91xMrCdEbMaNBupoB699ENzTC3zr_ZWM
      - VAPID_CLAIMS_EMAIL=mailto:contact@bagadmenru.bzh
    depends_on:
      - backend-init

  frontend:
    build:
      context: frontend
      target: node-env
    volumes:
      - ./frontend:/project
    ports:
      - 5173:5173
      - 6006:6006
    environment:
      - VITE_BBE2_API_URL=http://localhost:5173

volumes:
  s3data:
  pgdata:
  orydata:
  authdata:
