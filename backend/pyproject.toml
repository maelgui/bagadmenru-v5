[tool.poetry]
name = "bbe2"
version = "0.1.0"
description = ""
authors = ["Mael Guillossou <mael.guillossou@gmail.com>"]
scripts = { bbe2 = 'bbe2.cli:app' }

[tool.poetry.dependencies]
python = "^3.8"
fastapi = "^0.111.0"
uvicorn = "^0.33.0"
python-multipart = "^0.0.20"
boto3 = "^1.35.19"
pytest-cov = "^5.0.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
sqlalchemy = "^2.0.32"
psycopg = { extras = ["binary"], version = "^3.1.19" }
ics = "^0.7.2"
pydantic = "^2.10.5"
pydantic-settings = "^2.7.1"
python-keycloak = "^4.0.0"
email-validator = "^2.1.1"
itsdangerous = "^2.2.0"
pyjwt = "^2.9.0"
jinja2 = "^3.1.5"
passlib = { extras = ["argon2", "bcrypt"], version = "^1.7.4" }
alembic = "^1.14.0"
typer = "^0.13.1"
sentry-sdk = {extras = ["fastapi"], version = "^2.19.2"}

[tool.poetry.group.dev.dependencies]
httpx = "^0.27.0"
pylint = "^3.2.1"
pytest = "^8.2.0"
autopep8 = "^2.2.0"
mypy = "^1.14.1"
black = "^24.8.0"
isort = "^5.13.2"
types-python-jose = "^3.3.4.20240106"
boto3-stubs = "^1.35.61"
types-passlib = "^1.7.7.20240819"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pylint.'MESSAGES CONTROL']
extension-pkg-whitelist = "pydantic"

[tool.mypy]
plugins = ["pydantic.mypy"]
