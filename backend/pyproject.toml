[tool.poetry]
name = "bbe2"
version = "0.1.0"
description = ""
authors = ["Mael Guillossou <mael.guillossou@gmail.com>"]
scripts = { bbe2 = 'bbe2.cli:app' }

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.136.3"
uvicorn = "^0.48.0"
python-multipart = "^0.0.29"
boto3 = "1.35.64"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
sqlalchemy = "^2.0.38"
psycopg = { extras = ["binary"], version = "^3.2.4" }
ics = "^0.7.2"
pydantic = "^2.10.6"
pydantic-settings = "^2.7.1"
email-validator = "^2.1.1"
itsdangerous = "^2.2.0"
pyjwt = "^2.9.0"
jinja2 = "^3.1.5"
passlib = { extras = ["argon2", "bcrypt"], version = "^1.7.4" }
alembic = "^1.14.0"
typer = "^0.25.1"
sentry-sdk = { extras = ["fastapi"], version = "^2.20.0" }
apscheduler = "^3.11.0"
aiosmtplib = "^5.1.0"
imapclient = "^3.0.0"
httpx = "^0.28.1"

webauthn = "^2.5.2"
pywebpush = "^2.0.0"
py-vapid = "^1.9.0"
[tool.poetry.group.dev.dependencies]
pylint = "^3.3.4"
pytest = "^8.2.0"
autopep8 = "^2.2.0"
mypy = "^1.15.0"
black = "^25.1.0"
isort = "^6.0.1"
types-python-jose = "^3.4.0.20250224"
boto3-stubs = "^1.37.2"
types-passlib = "^1.7.7.20241221"
pytest-cov = "^6.0.0"
coverage = "^7.6.12"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pylint.'MESSAGES CONTROL']
extension-pkg-whitelist = "pydantic"

[tool.pytest.ini_options]
addopts = "--cov=bbe2 --cov-report html"

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.isort]
profile = "black"

[[tool.mypy.overrides]]
# Remove once updated to apscheduler 4
module = ["apscheduler.*"]
follow_untyped_imports = true
