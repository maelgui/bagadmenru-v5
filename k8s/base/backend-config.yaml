apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  ENVIRONMENT: "production"
  S3_ENDPOINT: "https://s3.fr-par.scw.cloud"
  S3_DEFAULT_REGION: "fr-par"
  SMTP_HOST: "ssl0.ovh.net"
  SMTP_PORT: "465"
  SMTP_USERNAME: "contact@bagadmenru.bzh"
  SMTP_USE_TLS: "true"
  EMAIL_FROM_NAME: "Bagad Men Ru"
  EMAIL_FROM_ADDRESS: "contact@bagadmenru.bzh"
  EMAIL_DRY_RUN: "false"
  IMAP_HOST: "ssl0.ovh.net"
  IMAP_PORT: "993"
  IMAP_USERNAME: "contact@bagadmenru.bzh"
  VAPID_CLAIMS_EMAIL: "mailto:contact@bagadmenru.bzh"
  AWS_RESPONSE_CHECKSUM_VALIDATION: "when_required"
  AWS_REQUEST_CHECKSUM_CALCULATION: "when_required"
  # Score renderer sidecars, reached in-cluster by service name. A format is
  # active only when its renderer URL is set, so these two lines are what
  # enable mscz and .ds conversion in deployed environments.
  MUSESCORE_RENDERER_URL: "http://musescore:8080"
  DRUMSCORE_RENDERER_URL: "http://drumscore:8080"
  SCORE_RENDER_TIMEOUT_SECONDS: "110"
  # These are overridden per environment
  DOMAIN: "PLACEHOLDER"
  FRONTEND_BASE_URL: "PLACEHOLDER"
  S3_BUCKET_NAME: "PLACEHOLDER"
  RELYING_PARTY_ID: "PLACEHOLDER"
