# Expose the Mailpit UI at https://<review-host>/_mail, gated by the site's
# own session via forwardAuth — same mechanism as beta/mailpit-ingress.yaml.
#
# The forwardAuth address must be the fully qualified Service name because
# Traefik runs in kube-system; the middleware reference uses the
# `<namespace>-<name>@kubernetescrd` provider syntax. Both carry the
# namespace, hence the placeholders (substituted by CI alongside the host).
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mailpit-auth
spec:
  forwardAuth:
    address: http://backend.REVIEW_NS_PLACEHOLDER.svc.cluster.local:8000/api/v1/auth/verify
    authRequestHeaders:
      - Cookie
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mailpit-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: "REVIEW_NS_PLACEHOLDER-mailpit-auth@kubernetescrd"
spec:
  tls:
    - hosts:
        - REVIEW_HOST_PLACEHOLDER
      secretName: bagadmenru-review-tls
  rules:
    - host: REVIEW_HOST_PLACEHOLDER
      http:
        paths:
          - path: /_mail
            pathType: Prefix
            backend:
              service:
                name: mailpit
                port:
                  number: 8025
