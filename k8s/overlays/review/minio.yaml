# In-namespace object storage for review apps (mirrors local dev's MinIO):
# review apps must never touch the real Scaleway buckets.
#
# Data lives in an emptyDir on purpose — review uploads are throwaway, and it
# avoids leaking a PVC per PR. A pod restart loses uploaded files, which is
# acceptable for an ephemeral environment (the DB itself has a PVC via the
# base postgres StatefulSet and dies with the namespace).
#
# MinIO is exposed publicly on its own host (REVIEW_S3_HOST_PLACEHOLDER)
# because the backend hands presigned GET/PUT URLs to the browser, and SigV4
# signatures pin the Host header — the signing endpoint and the browser-facing
# endpoint must be the same. TLS terminates at Traefik like everything else.
#
# MINIO_SITE_REGION matches the base config's S3_DEFAULT_REGION (fr-par) so
# region-pinned SigV4 signatures validate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio
          args: ["server", "/data"]
          envFrom:
            # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD, generated per namespace
            # by the review-app workflow (same values the backend uses as
            # S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY).
            - secretRef:
                name: minio-secrets
          env:
            - name: MINIO_SITE_REGION
              value: "fr-par"
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app: minio
  ports:
    - port: 9000
      targetPort: 9000
---
# Bucket creation, re-run on EVERY deploy: MinIO data is an emptyDir, so a
# pod restart wipes the bucket — a run-once job would leave the app 500ing on
# uploads until the namespace dies. The job name carries the deploy SHA
# (substituted by CI) so each deploy creates a fresh Job; `--ignore-existing`
# makes it idempotent and ttlSecondsAfterFinished garbage-collects old ones.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init-REVIEW_SHA_PLACEHOLDER
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc
          command:
            - sh
            - -c
            - |
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "waiting for minio..."; sleep 2
              done
              mc mb --ignore-existing local/bagadmenru-review
          envFrom:
            - secretRef:
                name: minio-secrets
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: "default-redirect-https@kubernetescrd,default-hsts@kubernetescrd"
spec:
  tls:
    - hosts:
        - REVIEW_S3_HOST_PLACEHOLDER
      secretName: bagadmenru-review-s3-tls
  rules:
    - host: REVIEW_S3_HOST_PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
