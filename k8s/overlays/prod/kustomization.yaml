apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bagadmenru-prod

resources:
  - ../../base
  - sealed-secrets.yaml

generatorOptions:
  disableNameSuffixHash: true

patches:
  - path: ingress-patch.yaml
  - path: backend-config-patch.yaml
  - path: frontend-config-patch.yaml

images:
  - name: ghcr.io/maelgui/bagadmenru-v5/backend
    newTag: latest
  - name: ghcr.io/maelgui/bagadmenru-v5/frontend
    newTag: latest
