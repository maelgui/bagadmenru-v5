# SealedSecret for backend — encrypted with cluster public key.
# To regenerate, use:
#   kubectl create secret generic backend-secrets \
#     --from-literal=SECRET_KEY=... \
#     --from-literal=JWT_SECRET_KEY=... \
#     --from-literal=TOKEN_SECRET_KEY=... \
#     --from-literal=S3_ACCESS_KEY_ID=... \
#     --from-literal=S3_SECRET_ACCESS_KEY=... \
#     --from-literal=SMTP_PASSWORD=... \
#     --from-literal=IMAP_PASSWORD=... \
#     --from-literal=OVH_APPLICATION_KEY=... \
#     --from-literal=OVH_APPLICATION_SECRET=... \
#     --from-literal=OVH_CONSUMER_KEY=... \
#     --from-literal=VAPID_PRIVATE_KEY=... \
#     --from-literal=VAPID_PUBLIC_KEY=... \
#     --dry-run=client -o yaml | kubeseal --format yaml > k8s/overlays/prod/sealed-secrets.yaml
#
# Then append the postgres sealed secret below using:
#   kubectl create secret generic postgres-secrets \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --dry-run=client -o yaml | kubeseal --format yaml >> k8s/overlays/prod/sealed-secrets.yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: backend-secrets
spec:
  encryptedData:
    SECRET_KEY: "SEALED_VALUE_HERE"
    JWT_SECRET_KEY: "SEALED_VALUE_HERE"
    TOKEN_SECRET_KEY: "SEALED_VALUE_HERE"
    S3_ACCESS_KEY_ID: "SEALED_VALUE_HERE"
    S3_SECRET_ACCESS_KEY: "SEALED_VALUE_HERE"
    SMTP_PASSWORD: "SEALED_VALUE_HERE"
    IMAP_PASSWORD: "SEALED_VALUE_HERE"
    OVH_APPLICATION_KEY: "SEALED_VALUE_HERE"
    OVH_APPLICATION_SECRET: "SEALED_VALUE_HERE"
    OVH_CONSUMER_KEY: "SEALED_VALUE_HERE"
    VAPID_PRIVATE_KEY: "SEALED_VALUE_HERE"
    VAPID_PUBLIC_KEY: "SEALED_VALUE_HERE"
  template:
    metadata:
      name: backend-secrets
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-secrets
spec:
  encryptedData:
    POSTGRES_PASSWORD: "SEALED_VALUE_HERE"
  template:
    metadata:
      name: postgres-secrets
    type: Opaque
