apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bagadmenru-beta

resources:
  - ../../base
  - sealed-secrets.yaml
  - mailpit.yaml
  - mailpit-ingress.yaml

# Namespace is created separately (not subject to namespace transformation)
generatorOptions:
  disableNameSuffixHash: true

patches:
  - path: ingress-patch.yaml
  - path: backend-config-patch.yaml
  - path: frontend-config-patch.yaml
  # Append the E2E seed initContainer after the base `migrate` container.
  # See backend-seed-patch.yaml for the ordering rationale.
  - path: backend-seed-patch.yaml
    target:
      kind: Deployment
      name: backend


# images: tags are set explicitly by CI via `kustomize edit set image`
