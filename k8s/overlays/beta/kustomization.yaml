apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bagadmenru-beta

resources:
  - ../../base
  - sealed-secrets.yaml
  - mailpit.yaml

# Namespace is created separately (not subject to namespace transformation)
generatorOptions:
  disableNameSuffixHash: true

patches:
  - path: ingress-patch.yaml
  - path: backend-config-patch.yaml
  - path: backend-seed-patch.yaml
  - path: frontend-config-patch.yaml

images:
  - name: ghcr.io/maelgui/bagadmenru-v5/backend
    newTag: beta
  - name: ghcr.io/maelgui/bagadmenru-v5/frontend
    newTag: beta
