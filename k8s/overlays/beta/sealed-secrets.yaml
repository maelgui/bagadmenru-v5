---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: backend-secrets
  namespace: bagadmenru-beta
spec:
  encryptedData:
    JWT_SECRET_KEY: 
    S3_ACCESS_KEY_ID: 
    S3_SECRET_ACCESS_KEY: 
    SECRET_KEY: 
    TOKEN_SECRET_KEY: 
    VAPID_PRIVATE_KEY: 
    HELLOASSO_WEBHOOK_TOKEN: 
    VAPID_PUBLIC_KEY: 
  template:
    metadata:
      name: backend-secrets
      namespace: bagadmenru-beta
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-secrets
  namespace: bagadmenru-beta
spec:
  encryptedData:
    POSTGRES_PASSWORD: 
  template:
    metadata:
      name: postgres-secrets
      namespace: bagadmenru-beta
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mailpit-secrets
  namespace: bagadmenru-beta
spec:
  encryptedData:
    # OVH SMTP password for the beta-sandbox mailbox, used by Mailpit's
    # message-forwarding (all captured mail is forwarded to beta-sandbox@).
    SMTP_FORWARD_PASSWORD: 
  template:
    metadata:
      name: mailpit-secrets
      namespace: bagadmenru-beta
