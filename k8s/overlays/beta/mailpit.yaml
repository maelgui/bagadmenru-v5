apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:latest
          # Mailpit is a test mail trap: it captures every message and makes it
          # readable in the web UI (exposed at /_mail behind the site session,
          # see mailpit-ingress.yaml). It does NOT forward mail to any real
          # SMTP server. Forwarding to OVH was removed because the relay added a
          # ~7s per-message delay (Mailpit only ACKs the sending backend after
          # the forward attempt finished), which pushed E2E email assertions
          # past their timeouts and turned every send synchronous-slow.
          env:
            # Serve the UI under /_mail so Mailpit emits its own asset, API and
            # WebSocket URLs with that prefix. Same webroot as the local compose
            # stack (docker-compose.yml) and the vite proxy, so the E2E Mailpit
            # URL shape is identical everywhere. Matches the Ingress path and
            # avoids rewriting responses (no stripPrefix needed).
            - name: MP_WEBROOT
              value: _mail
          ports:
            - containerPort: 1025
              name: smtp
            - containerPort: 8025
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: http
      port: 8025
      targetPort: 8025
