name: keycloak-release

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/keycloak

jobs:
  build-theme:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    name: Build keycloak theme jar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "21.x"
      - run: yarn
      - run: yarn build:theme
      - uses: actions/upload-artifact@v4
        with:
          name: bagad-keycloak-theme
          path: frontend/app/dist_keycloak/target/bagad-frontend-keycloak-theme-0.0.0.jar

  build-push-docker:
    runs-on: ubuntu-latest
    needs:
      - build-theme
    name: Build and push keycloak docker image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download theme jar artifact
        uses: actions/download-artifact@v4
        with:
          name: bagad-keycloak-theme
          path: keycloak/providers

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: keycloak
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
