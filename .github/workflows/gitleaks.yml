name: Secret scan

on:
  pull_request:
  push:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.3"
  GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"

jobs:
  # Scans the FULL git history on every run (~2s for ~1000 commits), not just
  # the pushed commits: this also catches a secret committed then "removed"
  # within the same PR, which would still be readable in history after merge.
  # Config: .gitleaks.toml (structural allowlists, e.g. sealed-secrets) and
  # .gitleaksignore (audited historical findings, pinned by fingerprint).
  # No paths-filter gating: a secret can land in any file.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history is required — the scan covers every commit.
          fetch-depth: 0

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Scan full history
        run: ./gitleaks git --redact --verbose .
