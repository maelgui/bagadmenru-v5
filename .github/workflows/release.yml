name: Release images

on:
  pull_request:
  push:
    branches:
      - "main"

env:
  REPO: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

jobs:
  lint-frontend:
    defaults:
      run:
        working-directory: frontend
    runs-on: ubuntu-latest
    name: Run linting frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn
      - run: yarn lint
      - run: yarn build
      - name: push artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/app/dist

  test-backend:
    env:
      ENVIRONMENT: ci
      SECRET_KEY: my-secret-key-in-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
      - name: Install dependencies
        run: poetry install
      - name: Run pylint
        run: poetry run pylint bbe2 --fail-under 8 --fail-on F,E,W
      - name: Run black
        run: poetry run black --check bbe2
      - name: Run isort
        run: poetry run isort --check bbe2
      - name: Run mypy
        run: poetry run mypy bbe2
      - name: Run tests
        run: poetry run pytest

  build-push:
    if: ${{ github.event_name == 'push' }}
    needs:
      - test-backend
      - lint-frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image_name: backend
          - image_name: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - run: tree ${{ matrix.image_name }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image_name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image_name }}
          push: true
          tags: |
            ${{ env.REPO }}/${{ matrix.image_name }}:beta
            ${{ env.REPO }}/${{ matrix.image_name }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REPO }}/${{ matrix.image_name }}:buildcache
          cache-to: type=registry,ref=${{ env.REPO }}/${{ matrix.image_name }}:buildcache,mode=max
          sbom: false
          provenance: false

      - name: Clear old packages
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}/${{ matrix.image_name }}
          package-type: "container"
          min-versions-to-keep: 3
          delete-only-untagged-versions: "true"

  deploy:
    if: ${{ github.event_name == 'push' }}
    needs:
      - lint-frontend
    runs-on: ubuntu-latest
    env:
      VITE_BBE2_API_URL: https://api.beta.bagadmenru.bzh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist

      - run: envsubst < frontend/.docker/app-config.js.template > dist/app-config.js

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=bagadmenru-dashboard
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
