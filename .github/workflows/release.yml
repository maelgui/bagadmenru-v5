name: Release images

on:
  push:
    branches:
      - "main"

env:
  REPO: ghcr.io/${{ github.repository }}

jobs:

  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: psf/black@stable
        with:
          use_pyproject: true

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
      - name: Install dependencies
        run: poetry install
      - name: Run test
        run: poetry run pylint
      - name: Run test
        run: poetry run black --check
      - name: Run test
        run: poetry run mypy
      - name: Run test
        run: poetry run pytest

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image_name: backend
          - image_name: frontend
          - image_name: auth-provider
          - image_name: email-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image_name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image_name }}
          push: true
          tags: ${{ env.REPO }}/${{ matrix.image_name }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REPO }}/${{ matrix.image_name }}:buildcache
          cache-to: type=registry,ref=${{ env.REPO }}/${{ matrix.image_name }}:buildcache,mode=max
          sbom: false
          provenance: false

      - name: Clear old packages
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}/${{ matrix.image_name }}
          package-type: 'container'
          min-versions-to-keep: 3
          delete-only-untagged-versions: 'true'
