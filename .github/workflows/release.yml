name: Release images

on:
  push:
    branches:
      - "main"

env:
  REPO: ghcr.io/${{ github.repository }}

jobs:
  lint-frontend:
    defaults:
      run:
        working-directory: frontend
    runs-on: ubuntu-latest
    name: Run lintint frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn
      - run: yarn lint

  lint-authprovider:
    defaults:
      run:
        working-directory: auth-provider
    runs-on: ubuntu-latest
    name: Run linting auth-provider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: yarn
          cache-dependency-path: auth-provider/yarn.lock
      - run: yarn
      - run: yarn lint

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
      - name: Install dependencies
        run: poetry install
      - name: Run pylint (disabled)
        run: poetry run pylint bbe2 || true
      - name: Run black
        run: poetry run black --check bbe2
      - name: Run mypy
        run: poetry run mypy bbe2
      - name: Run test (disabled)
        run: poetry run pytest || true

  build-auth-policy:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Setup OPA
      uses: open-policy-agent/setup-opa@v2
      with:
        version: latest

    - run: mkdir ${{ runner.temp }}/policies
    - name: Run OPA Tests
      run: opa build -t wasm -e bbe2/policies ./opa --output ${{ runner.temp }}/policies/bundle.tar.gz

    - name: Untar OPA bundle
      run: tar -xzf ${{ runner.temp }}/policies/bundle.tar.gz -C ${{ runner.temp }}/policies

    - name: Upload OPA bundle
      uses: actions/upload-artifact@v3
      with:
        name: opa-bundle
        path: ${{ runner.temp }}/policies/policy.wasm

    - name: Copy OPA wasm
      run: cp ${{ runner.temp }}/policies/policy.wasm frontend/app/src/assets/policy.wasm


  build:
    needs:
      - test-backend
      - lint-authprovider
      - lint-frontend
      - build-auth-policy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image_name: backend
          - image_name: frontend
          - image_name: auth-provider
          - image_name: email-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image_name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image_name }}
          push: true
          tags: |
            ${{ env.REPO }}/${{ matrix.image_name }}:beta
            ${{ env.REPO }}/${{ matrix.image_name }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REPO }}/${{ matrix.image_name }}:buildcache
          cache-to: type=registry,ref=${{ env.REPO }}/${{ matrix.image_name }}:buildcache,mode=max
          sbom: false
          provenance: false

      - name: Clear old packages
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}/${{ matrix.image_name }}
          package-type: "container"
          min-versions-to-keep: 3
          delete-only-untagged-versions: "true"
