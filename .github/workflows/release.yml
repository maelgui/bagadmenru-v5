name: CI / Deploy

on:
  pull_request:
  push:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # Detect which components a PR touches so unrelated jobs can be skipped
  # (Actions minutes are billed per job-minute, so skipping whole jobs is the
  # main quota lever). Only runs on pull_request: on push to main every job
  # runs unconditionally — the deploy chain must never depend on a diff.
  #
  # Dependency chain to keep in mind: backend → generated lib client →
  # frontend. A backend change can alter the OpenAPI schema, so
  # client-up-to-date must run on backend changes; if the schema did change,
  # that gate fails and forces a lib regeneration commit, which is a
  # frontend/** change and triggers lint-frontend on the next push. That is
  # why lint-frontend itself can safely skip backend-only changes: it builds
  # against the *committed* client.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/release.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/release.yml'

  lint-frontend:
    needs: changes
    # !cancelled(): run even though `changes` is skipped on push events.
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || needs.changes.outputs.frontend == 'true')
    defaults:
      run:
        working-directory: frontend
    runs-on: ubuntu-latest
    name: Lint & build frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn
      - run: yarn build
      - run: yarn lint

  client-up-to-date:
    needs: changes
    # Runs on backend OR frontend changes: the backend defines the schema,
    # and a frontend change may touch the committed lib/ by hand.
    if: >-
      !cancelled() &&
      (github.event_name == 'push' ||
       needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    name: Generated API client is up to date
    steps:
      - uses: actions/checkout@v6
      - name: Install poetry
        run: pipx install poetry
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: poetry
      - name: Install backend dependencies
        working-directory: backend
        run: poetry install
      - name: Export OpenAPI schema
        working-directory: backend
        env:
          ENVIRONMENT: ci
          SECRET_KEY: my-secret-key-in-ci
        run: poetry run python scripts/export_openapi.py > "$RUNNER_TEMP/openapi.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn
      - name: Regenerate client from the exported schema
        working-directory: frontend
        env:
          OPENAPI_SPEC: ${{ runner.temp }}/openapi.json
        run: |
          # Clean first so endpoints removed from the backend show up as
          # deleted files in the diff (the generator never deletes stale files).
          rm -rf lib/src
          yarn generate-client
      - name: Fail if the committed client differs
        run: |
          # -N registers untracked generated files (new endpoints/models) so
          # they show up in git diff alongside modifications and deletions.
          git add -N frontend/lib
          if ! git diff --quiet -- frontend/lib; then
            echo "::error::frontend/lib is out of sync with the backend OpenAPI schema. Regenerate it with 'yarn generate-client' (see CONTRIBUTING.md) and commit the result."
            git diff --stat -- frontend/lib
            exit 1
          fi
          echo "Generated client is up to date."

  # Unit tests + migration tests share one job: poetry/pipx setup was
  # duplicated across two jobs (~2-3 billed minutes per PR push). The
  # postgres service is only used by the migrations step — DATABASE_URL is
  # scoped to that step so the unit tests keep running exactly as before.
  test-backend:
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || needs.changes.outputs.backend == 'true')
    env:
      ENVIRONMENT: ci
      SECRET_KEY: my-secret-key-in-ci
    runs-on: ubuntu-latest
    name: Test backend & migrations
    defaults:
      run:
        shell: bash
        working-directory: ./backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Install poetry
        run: pipx install poetry
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: poetry
      - name: Install dependencies
        run: poetry install
      - name: Run pylint
        run: poetry run pylint bbe2 --fail-under 8 --fail-on F,E,W --output-format=github --disable=C,R
      - name: Run black
        run: poetry run black --check bbe2
      - name: Run isort
        run: poetry run isort --check bbe2
      - name: Run mypy
        run: poetry run mypy bbe2
      - name: Run tests
        run: poetry run pytest -m "not migrations"
      - name: Run migration tests
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: poetry run pytest -m migrations --no-cov

  build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test-backend
      - lint-frontend
      - client-up-to-date
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image_name: backend
          - image_name: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.image_name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image_name }}
          push: true
          tags: |
            ${{ env.REPO }}/${{ matrix.image_name }}:${{ github.sha }}
            ${{ env.REPO }}/${{ matrix.image_name }}:latest
          build-args: |
            APP_VERSION=v${{ github.run_number }}
          cache-from: type=registry,ref=${{ env.REPO }}/${{ matrix.image_name }}:buildcache
          cache-to: type=registry,ref=${{ env.REPO }}/${{ matrix.image_name }}:buildcache,mode=max
          sbom: false
          provenance: false

      - name: Clear old packages
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}/${{ matrix.image_name }}
          package-type: "container"
          min-versions-to-keep: 5
          delete-only-untagged-versions: "true"

  deploy-beta:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-push
    runs-on: ubuntu-latest
    environment:
      name: beta
      url: https://beta.bagadmenru.bzh
    outputs:
      e2e_user_password: ${{ steps.e2e-creds.outputs.E2E_USER_PASSWORD }}
      e2e_admin_password: ${{ steps.e2e-creds.outputs.E2E_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Generate E2E credentials
        id: e2e-creds
        run: |
          echo "E2E_USER_PASSWORD=$(openssl rand -base64 24)" >> $GITHUB_OUTPUT
          echo "E2E_ADMIN_PASSWORD=$(openssl rand -base64 24)" >> $GITHUB_OUTPUT

      - name: Create E2E credentials secret
        run: |
          kubectl create secret generic e2e-credentials \
            --namespace=bagadmenru-beta \
            --from-literal=E2E_USER_EMAIL=e2e@bagadmenru.bzh \
            --from-literal=E2E_USER_PASSWORD=${{ steps.e2e-creds.outputs.E2E_USER_PASSWORD }} \
            --from-literal=E2E_ADMIN_EMAIL=e2e-admin@bagadmenru.bzh \
            --from-literal=E2E_ADMIN_PASSWORD=${{ steps.e2e-creds.outputs.E2E_ADMIN_PASSWORD }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Set image tag to commit SHA
        working-directory: k8s/overlays/beta
        run: |
          kustomize edit set image \
            ghcr.io/maelgui/bagadmenru-v5/backend=${{ env.REPO }}/backend:${{ github.sha }} \
            ghcr.io/maelgui/bagadmenru-v5/frontend=${{ env.REPO }}/frontend:${{ github.sha }}

      - name: Deploy to beta
        run: kubectl apply -k k8s/overlays/beta

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n bagadmenru-beta --timeout=120s
          kubectl rollout status deployment/frontend -n bagadmenru-beta --timeout=120s

      - name: Verify migrations applied
        run: |
          # The migrate initContainer runs `alembic upgrade head`; a failed
          # migration otherwise surfaces only as an obscure rollout timeout.
          # Assert explicitly, inside the pod (which has alembic + the code),
          # that the DB revision matches the image's head so a failure is
          # actionable ("DB at X, head Y") instead of silent.
          HEAD=$(kubectl exec deploy/backend -n bagadmenru-beta -- \
            sh -c "alembic heads 2>/dev/null | awk '{print \$1}'")
          CURRENT=$(kubectl exec deploy/backend -n bagadmenru-beta -- \
            sh -c "alembic current 2>/dev/null | awk '{print \$1}'")
          echo "Image head: $HEAD"
          echo "DB current: $CURRENT"
          if [ -z "$HEAD" ] || [ "$HEAD" != "$CURRENT" ]; then
            echo "::error::Migration mismatch — DB is at '$CURRENT' but image head is '$HEAD'"
            exit 1
          fi

  e2e-beta:
    needs:
      - deploy-beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Wait for Mailpit to be ready
        run: kubectl rollout status deployment/mailpit -n bagadmenru-beta --timeout=60s

      - name: Port-forward Mailpit
        run: |
          kubectl port-forward svc/mailpit 8025:8025 -n bagadmenru-beta &
          sleep 3

      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # The chromium download (~150MB) is the slow part of `playwright
      # install`; cache it keyed on the lockfile (which pins the playwright
      # version). On a hit only the apt system deps need installing.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium

      - name: Run E2E tests against beta
        working-directory: e2e
        run: npm run test:ci
        env:
          CI: true
          E2E_USER_PASSWORD: ${{ needs.deploy-beta.outputs.e2e_user_password }}
          E2E_ADMIN_PASSWORD: ${{ needs.deploy-beta.outputs.e2e_admin_password }}

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/

  deploy-prod:
    needs:
      - e2e-beta
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://prod.bagadmenru.bzh
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Set image tag to commit SHA
        working-directory: k8s/overlays/prod
        run: |
          kustomize edit set image \
            ghcr.io/maelgui/bagadmenru-v5/backend=${{ env.REPO }}/backend:${{ github.sha }} \
            ghcr.io/maelgui/bagadmenru-v5/frontend=${{ env.REPO }}/frontend:${{ github.sha }}

      - name: Deploy to production
        run: kubectl apply -k k8s/overlays/prod

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n bagadmenru-prod --timeout=180s
          kubectl rollout status deployment/frontend -n bagadmenru-prod --timeout=180s

      - name: Verify migrations applied
        run: |
          HEAD=$(kubectl exec deploy/backend -n bagadmenru-prod -- \
            sh -c "alembic heads 2>/dev/null | awk '{print \$1}'")
          CURRENT=$(kubectl exec deploy/backend -n bagadmenru-prod -- \
            sh -c "alembic current 2>/dev/null | awk '{print \$1}'")
          echo "Image head: $HEAD"
          echo "DB current: $CURRENT"
          if [ -z "$HEAD" ] || [ "$HEAD" != "$CURRENT" ]; then
            echo "::error::Migration mismatch — DB is at '$CURRENT' but image head is '$HEAD'"
            exit 1
          fi

  smoke-prod:
    needs:
      - deploy-prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium

      - name: Smoke test
        working-directory: e2e
        run: npm run test:smoke
        env:
          CI: true
          BASE_URL: https://prod.bagadmenru.bzh
