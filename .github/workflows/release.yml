name: CI / Deploy

on:
  pull_request:
  push:
    branches:
      - "main"

env:
  REPO: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  lint-frontend:
    defaults:
      run:
        working-directory: frontend
    runs-on: ubuntu-latest
    name: Lint & build frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn
      - run: yarn lint
      - run: yarn build

  test-backend:
    env:
      ENVIRONMENT: ci
      SECRET_KEY: my-secret-key-in-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
      - name: Install dependencies
        run: poetry install
      - name: Run pylint
        run: poetry run pylint bbe2 --fail-under 8 --fail-on F,E,W --output-format=github --disable=C,R
      - name: Run black
        run: poetry run black --check bbe2
      - name: Run isort
        run: poetry run isort --check bbe2
      - name: Run mypy
        run: poetry run mypy bbe2
      - name: Run tests
        run: poetry run pytest

  build-push:
    if: github.event_name == 'push'
    needs:
      - test-backend
      - lint-frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image_name: backend
          - image_name: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image_name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image_name }}
          push: true
          tags: |
            ${{ env.REPO }}/${{ matrix.image_name }}:${{ github.sha }}
            ${{ env.REPO }}/${{ matrix.image_name }}:latest
          cache-from: type=registry,ref=${{ env.REPO }}/${{ matrix.image_name }}:buildcache
          cache-to: type=registry,ref=${{ env.REPO }}/${{ matrix.image_name }}:buildcache,mode=max
          sbom: false
          provenance: false

      - name: Clear old packages
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}/${{ matrix.image_name }}
          package-type: "container"
          min-versions-to-keep: 5
          delete-only-untagged-versions: "true"

  deploy-beta:
    if: github.event_name == 'push'
    needs:
      - build-push
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Set image tag to commit SHA
        working-directory: k8s/overlays/beta
        run: |
          kustomize edit set image \
            ghcr.io/maelgui/bagadmenru-v5/backend=${{ env.REPO }}/backend:${{ github.sha }} \
            ghcr.io/maelgui/bagadmenru-v5/frontend=${{ env.REPO }}/frontend:${{ github.sha }}

      - name: Deploy to beta
        run: kubectl apply -k k8s/overlays/beta

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n bagadmenru-beta --timeout=120s
          kubectl rollout status deployment/frontend -n bagadmenru-beta --timeout=120s
