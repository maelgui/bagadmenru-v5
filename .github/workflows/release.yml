name: Release images

on:
  push:
    branches:
      - "main"

env:
  REPO: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write
jobs:
  lint-frontend:
    defaults:
      run:
        working-directory: frontend
    runs-on: ubuntu-latest
    name: Run lintint frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn
      - run: yarn lint

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
      - name: Install dependencies
        run: poetry install
      - name: Run pylint (disabled)
        run: poetry run pylint bbe2 --fail-under 8 --fail-on F,E,W
      - name: Run black
        run: poetry run black --check bbe2
      - name: Run mypy
        run: poetry run mypy bbe2
      - name: Run test (disabled)
        run: poetry run pytest

  build-authz-policy-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - run: mkdir ${{ runner.temp }}/build
      - name: Run OPA Tests
        run: opa build -t wasm -e bbe2/authz ./opa --output ${{ runner.temp }}/build/bundle.tar.gz

      - name: Untar OPA bundle
        run: tar -xzf ${{ runner.temp }}/build/bundle.tar.gz -C ${{ runner.temp }}/build

      - name: Upload OPA bundle
        uses: actions/upload-artifact@v4
        with:
          name: opa-policy-wasm
          path: ${{ runner.temp }}/build/policy.wasm

      - run: mkdir build

  build-authz-policy-oci:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./opa
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2

      - name: Setup ORAS
        uses: oras-project/setup-oras@v1

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build OPA bundle
        run: opa build -b . -o bundle.tar.gz

      - run: oras push ${{ env.REPO }}/policy:beta --config config.yaml:application/vnd.oci.image.config.v1+json bundle.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip

  build:
    needs:
      - test-backend
      - lint-frontend
      - build-authz-policy-wasm
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image_name: backend
          - image_name: frontend
          - image_name: email-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Opa Policy
        uses: actions/download-artifact@v4
        with:
          name: opa-policy-wasm
          path: frontend/app/src/assets/
      - run: tree ${{ matrix.image_name }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image_name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image_name }}
          push: true
          tags: |
            ${{ env.REPO }}/${{ matrix.image_name }}:beta
            ${{ env.REPO }}/${{ matrix.image_name }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REPO }}/${{ matrix.image_name }}:buildcache
          cache-to: type=registry,ref=${{ env.REPO }}/${{ matrix.image_name }}:buildcache,mode=max
          sbom: false
          provenance: false

      - name: Clear old packages
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}/${{ matrix.image_name }}
          package-type: "container"
          min-versions-to-keep: 3
          delete-only-untagged-versions: "true"
