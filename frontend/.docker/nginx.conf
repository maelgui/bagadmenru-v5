server {
  listen       80;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_vary on;
  gzip_min_length 10240;
  gzip_comp_level 5;
  gzip_proxied any;

  root   /usr/share/nginx/html;
  index  index.html index.htm;

  # Hashed build assets (Vite emits content-hashed filenames): cache forever.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Non-hashed entrypoints must always be revalidated so a new deploy is picked
  # up immediately (e.g. after moving the API to the same-origin /api path).
  # Without this, a stale index.html/app-config.js could keep an old API URL.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /app-config.js {
    add_header Cache-Control "no-cache";
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html =404;
  }
}
