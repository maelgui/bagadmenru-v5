[package]
name = "email-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.7"
chrono = { version = "0.4.38", features = ["serde"] }
config = "0.14.1"
dateparser = "0.2.1"
# imap = { version = "=3.0.0-alpha.14", default-features = false, features = [
#     "rustls-tls",
# ] }
imap = { version = "=3.0.0-alpha.14" }
lettre = "0.11.10"
mailparse = "0.15.0"
native-tls = "0.2.12"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.1"
tokio = { version = "1.41.1", features = ["full"] }
tower-http = { version = "0.6.1", features = ["cors", "trace"] }
tracing = "0.1.40"

tracing-subscriber = { version = "0.3", features = ["env-filter"] }
