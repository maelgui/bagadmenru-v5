<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Drum Score Editor is a jpackage app whose bundled JRE carries no
    fontconfig.properties, so Java2D resolves its logical "Serif"/"SansSerif"
    families through the container's fontconfig. Without this, fc-match serif
    returns DejaVu Serif (heavy, low stroke contrast), which bakes the wrong
    letterforms into the exported PDF. Prefer the Times-metric Liberation
    family so titles match scores authored on Windows/macOS.
  -->
  <alias>
    <family>serif</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
</fontconfig>
