version: '3.8'

services:
  keycloak-postgres:
    image: postgres:15-alpine
    volumes:
      - keycloak-pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${KEYCLOAK_DATABASE_PASSWORD}
    restart: unless-stopped
    networks:
      - default

  keycloak:
    image: ghcr.io/maelgui/bagadmenru-v5/keycloak
    command: start --optimized --proxy edge
    expose:
      - 8080
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KEYCLOAK_PRODUCTION=true
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DATABASE_PASSWORD}
      - KC_DB_URL_HOST=keycloak-postgres
      - KC_DB_URL_DATABASE=keycloak
      - KC_PROXY=edge
      - KC_HOSTNAME=auth.beta.bagadmenru.bzh
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bagadmenru-keycloak.rule=Host(`auth.beta.bagadmenru.bzh`)"
      - "traefik.http.routers.bagadmenru-keycloak.tls.certresolver=myresolver"
    restart: unless-stopped

  backend-postgres:
    image: postgres:15-alpine
    volumes:
      - backend-pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=bagadmenru
      - POSTGRES_PASSWORD=${BACKEND_DATABASE_PASSWORD}
    restart: unless-stopped
    networks:
      - default

  backend:
    image: ghcr.io/maelgui/bagadmenru-v5/backend
    expose:
      - 8000
    environment:
      - DATABASE_URL=postgresql+psycopg://bagadmenru:${BACKEND_DATABASE_PASSWORD}@backend-postgres/bagadmenru
      - JWT_AUDIENCE=bbe2
      - JWT_ISSUER=https://auth.beta.bagadmenru.bzh/realms/bagadmenru
      - OIDC_AUTHORIZATION_URL=https://auth.beta.bagadmenru.bzh/realms/bagadmenru/protocol/openid-connect/auth
      - OIDC_TOKEN_URL=https://auth.beta.bagadmenru.bzh/realms/bagadmenru/protocol/openid-connect/token
      - OIDC_JWKS_URL=https://auth.beta.bagadmenru.bzh/realms/bagadmenru/protocol/openid-connect/certs
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_KEY}
      - S3_ENDPOINT=https://s3.fr-par.scw.cloud
      - S3_BUCKET_NAME=bagadmenru5-data-staging
      - S3_DEFAULT_REGION=fr-par
      - CORS_ALLOWED_ORIGINS=["https://beta.bagadmenru.bzh", "http://localhost:5173"]
      - CORS_ALLOWED_ORIGIN_REGEX=https://.*\.app\.github\.dev
    restart: unless-stopped
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bagadmenru-backend.rule=Host(`api.beta.bagadmenru.bzh`)"
      - "traefik.http.routers.bagadmenru-backend.tls.certresolver=myresolver"

  frontend:
    image: ghcr.io/maelgui/bagadmenru-v5/frontend
    expose:
      - 80
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bagadmenru-frontend.rule=Host(`beta.bagadmenru.bzh`)"
      - "traefik.http.routers.bagadmenru-frontend.tls.certresolver=myresolver"
    restart: unless-stopped

volumes:
  s3data:
  keycloak-pgdata:
  backend-pgdata:


networks:
  traefik:
    external: true
